name: Publish FOP server image

# Builds the FOP service image (fop-server/) for amd64 and arm64.
# - Release published: pushes ghcr.io/<owner>/paperless-ngx-erechnung-fop
#   tagged with the release version (e.g. 0.1.5 and 0.1) and `latest`.
# - Manual run: pushes a `sha-<commit>` tag for testing.
# - Pull requests touching the image: build only, no push.

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    paths:
      - "fop-server/**"
      - "src/paperless_ngx_erechnung/xslt/conf/**"
      - ".github/workflows/fop-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-fop
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: fop-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
